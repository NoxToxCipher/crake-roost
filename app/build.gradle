plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.crake.roost'
    compileSdk 34

    defaultConfig {
        applicationId 'com.crake.roost'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'

        // arm64-v8a for real phones, x86_64 for the emulator.
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }

    // The native .so files are prebuilt and live in src/main/jniLibs, so there
    // is no externalNativeBuild step; Gradle packages them as-is.

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
